# Builds Vexis and runs the unit tests on every push and pull request, so a change
# that breaks fan-curve maths, sensor mapping, update handling etc. shows up red
# before it is merged. Tests are in tests/Vexis.Tests (run locally: dotnet test tests/Vexis.Tests).
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']          # tagged builds are covered by the Release workflow
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Build the app
        run: dotnet build Pcmonitor2_0.csproj -c Release

      - name: Run the unit tests
        run: dotnet test tests/Vexis.Tests -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: test-results
          path: tests/Vexis.Tests/TestResults/*.trx
